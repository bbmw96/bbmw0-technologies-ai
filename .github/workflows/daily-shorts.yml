name: Daily Shorts

# CADENCE: Monday, Wednesday, Friday at 09:00 UTC. One video per channel.
#
# This used to be four a weekday plus two at weekends, on three channels —
# fourteen videos a day. That was changed deliberately, and not for cost.
#
# In July 2025 YouTube renamed its "repetitious content" policy to INAUTHENTIC
# CONTENT, and the first category it names is generic, repetitive or
# template-based content. Detection runs at CHANNEL level, not per video, and
# the penalty ladder ends at permanent removal from the Partner Program.
# Fourteen templated videos a day from one composition is close to a
# description of what that policy targets.
#
# The volume was never buying anything either. Ad revenue needs 1,000
# subscribers and 20 million Shorts views in 90 days for new creators as of
# February 2026 — about 220,000 views a day. Publishing more thin videos does
# not move that number; it just raises the risk of being removed before
# reaching it.
#
# Three a week per channel, each one a researched Editorial Reel, is the trade:
# far below the mass-production signal, and every upload is something a person
# might actually finish watching.
on:
  schedule:
    - cron: "0 9 * * 1,3,5"
  workflow_dispatch:
    # Lets you trigger manually from the Actions tab.
    inputs:
      count:
        description: "Number of Shorts to publish"
        required: false
        default: "4"
      special:
        description: "Weekend special treatment (45s, premium pacing)"
        type: boolean
        default: false
      niche:
        description: "Optional niche filter (animals, space, science, etc.)"
        required: false
        default: ""
      research:
        description: "Refresh topics from AI research first?"
        type: boolean
        default: false
      channel:
        description: "Channel id from scripts/data/channels.json (blank = first enabled)"
        required: false
        default: ""

permissions:
  contents: write   # needed to commit history back

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # One job PER CHANNEL. Previously a single job ran, and with no channel
    # input the generator fell back to the first enabled channel, so the daily
    # schedule only ever published to @bbmw.0. Channels two and three would
    # never have run automatically no matter what secrets were set.
    #
    # fail-fast: false so one channel's failure does not cancel the others.
    # max-parallel: 1 because they share published.json and would otherwise
    # race each other on the commit-history-back step.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel:
          - yt-bbmw0
          - yt-bbm0902
          - ig-aigameodyssey

    steps:
      - name: Skip channels not selected for this run
        id: gate
        run: |
          WANTED="${{ inputs.channel }}"
          THIS="${{ matrix.channel }}"
          EVENT="${{ github.event_name }}"

          # Channels held back from the AUTOMATIC schedule only. A manual
          # dispatch that names one still publishes it, so this is a hold and
          # not a disable.
          #
          # This lives here rather than in channels.json because this step runs
          # BEFORE checkout, so channels.json is not on disk yet.
          #
          # Empty on purpose. All three channels run automatically.
          #
          # Quality is no longer defended by a hand-maintained hold list, which
          # needed editing every time the topic library changed and was one
          # forgotten commit away from publishing filler. The scheduled run
          # passes --reels-only instead, so a channel publishes a researched
          # reel or is skipped. yt-bbm0902 skips itself until it has topics in
          # animals, space, biology, food or weather, and resumes on its own.
          #
          # Keep this list for genuine emergencies — a channel under review, a
          # credential problem — not for quality. Quality is handled upstream.
          AUTO_HOLD=""

          if [ -n "$WANTED" ] && [ "$WANTED" != "$THIS" ]; then
            echo "run=false" >> $GITHUB_OUTPUT
            echo "Manual dispatch targeted $WANTED, skipping $THIS."
          elif [ "$EVENT" = "schedule" ] && echo " $AUTO_HOLD " | grep -q " $THIS "; then
            echo "run=false" >> $GITHUB_OUTPUT
            echo "$THIS is held back from the automatic schedule. Trigger it manually to publish."
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true' 
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 20
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Strip UTF-8 BOMs (OneDrive sync guard)
        if: steps.gate.outputs.run == 'true'
        run: |
          CLEANED=0
          for f in $(find scripts src .github -type f \( -name "*.json" -o -name "*.mjs" -o -name "*.yml" -o -name "*.ts" -o -name "*.tsx" \) 2>/dev/null); do
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              sed -i '1s/^\xEF\xBB\xBF//' "$f"
              echo "::warning title=BOM stripped::$f had a UTF-8 BOM and was cleaned."
              CLEANED=$((CLEANED+1))
            fi
          done
          echo "BOM guard: $CLEANED file(s) cleaned."
          node -e "const rd=p=>JSON.parse(require('fs').readFileSync(p,'utf8').replace(/^\uFEFF/,'')); rd('./scripts/data/topics.json'); rd('./scripts/data/copy-pools.json'); rd('./scripts/data/published.json'); console.log('All data files parse cleanly.')"

      - name: Install ffmpeg + deps
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install
          npm install googleapis

      - name: Restore YouTube credentials from secrets
        if: steps.gate.outputs.run == 'true'
        env:
          # Channel 1 (@bbmw.0)
          YT_OAUTH_CLIENT_JSON: ${{ secrets.YT_OAUTH_CLIENT_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          # Channel 2 (@bbm0902)
          YT2_OAUTH_CLIENT_JSON: ${{ secrets.YT2_OAUTH_CLIENT_JSON }}
          YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
          YT2_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
          YT2_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
        run: |
          # Materialise a credentials file per channel from its secret prefix.
          #
          # Previously this only wrote channel 1's file. render-batch passes
          # --credentials=<channel.credentialsFile> from the registry, so a
          # channel-2 run looked for scripts/yt-credentials-bbm0902.json, which
          # exists only on the operator's machine. Every channel-2 upload failed
          # with "Missing ... Run npm run yt:rotate first" AFTER rendering,
          # wasting a full render each time.
          #
          # Driven by channels.json so adding a channel needs no workflow edit.
          node -e '
            const fs = require("fs");
            const rd = p => JSON.parse(fs.readFileSync(p, "utf8").replace(/^\uFEFF/, ""));
            const chans = (rd("./scripts/data/channels.json").channels || [])
              .filter(c => c.platform === "youtube");
            let wrote = 0, skipped = [];
            for (const c of chans) {
              const p = c.secretPrefix;
              const token  = process.env[`${p}_REFRESH_TOKEN`];
              const id     = process.env[`${p}_CLIENT_ID`];
              const secret = process.env[`${p}_CLIENT_SECRET`];
              const client = process.env[`${p}_OAUTH_CLIENT_JSON`];
              if (!token || !id || !secret) { skipped.push(`${c.id} (${p}_* not set)`); continue; }
              fs.writeFileSync(c.credentialsFile,
                JSON.stringify({ client_id: id, client_secret: secret, refresh_token: token }, null, 2));
              if (client) {
                const suffix = p === "YT" ? "" : "-" + c.id.replace(/^yt-/, "");
                fs.writeFileSync(`scripts/oauth-client${suffix}.json`, client);
              }
              console.log(`  restored ${c.id} -> ${c.credentialsFile}`);
              wrote++;
            }
            if (skipped.length) console.log(`  skipped: ${skipped.join(", ")}`);
            if (!wrote) { console.error("No YouTube credentials could be restored."); process.exit(1); }
          '

      - name: (Optional) Refresh topic library via AI research
        if: ${{ inputs.research == true && steps.gate.outputs.run == 'true' }}
        env:
          AI_ENDPOINT: ${{ secrets.AI_ENDPOINT }}
        run: |
          node scripts/research-trends.mjs --count=10 || echo "research skipped (non-fatal)"

      - name: Auto-refill topics if library is running low
        if: steps.gate.outputs.run == 'true'
        env:
          AI_ENDPOINT: ${{ secrets.AI_ENDPOINT }}
        run: |
          RD="p=>JSON.parse(require('fs').readFileSync(p,'utf8').replace(/^\uFEFF/,''))"
          TOTAL=$(node -e "const rd=$RD; console.log(rd('./scripts/data/topics.json').topics.length)")
          USED=$(node -e "const rd=$RD; console.log((rd('./scripts/data/published.json').topicsUsed||[]).length)")
          UNUSED=$((TOTAL - USED))
          echo "Topic library: $TOTAL total, $USED used, $UNUSED unused."
          if [ "$UNUSED" -lt 5 ]; then
            echo "::warning title=Low topics::Only $UNUSED topics remaining. Running AI auto-refill."
            if [ -n "$AI_ENDPOINT" ]; then
              node scripts/research-trends.mjs --count=15 || echo "::warning::Auto-refill failed (non-fatal)."
            else
              echo "::warning title=Low topics::AI_ENDPOINT secret not set. Add topics to scripts/data/topics.json manually."
            fi
          fi

      # id is load-bearing. This step wrote "skip=true" to GITHUB_OUTPUT, but
      # without an id no later step could reference steps.<id>.outputs.skip, so
      # the result was written and then discarded. The check ran, correctly
      # detected the missing Instagram credential, printed a warning nobody
      # was listening to, and the run carried on to render four videos and die
      # at the upload — which is precisely the waste the step exists to prevent.
      - name: Preflight channel credentials
        id: creds
        if: steps.gate.outputs.run == 'true'
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          # Check BEFORE rendering. Discovering a missing credential after a
          # six-minute render wastes the whole run, which is exactly what
          # happened to channel two.
          CH="${{ matrix.channel }}"
          node -e '
            const fs = require("fs");
            const rd = p => JSON.parse(fs.readFileSync(p,"utf8").replace(/^\uFEFF/,""));
            const id = process.argv[1];
            const c = (rd("./scripts/data/channels.json").channels||[]).find(x=>x.id===id);
            if (!c) { console.log(`::warning::Unknown channel ${id}, skipping.`); process.exit(78); }
            if (!c.enabled) { console.log(`::warning::${id} is disabled, skipping.`); process.exit(78); }
            const missing = [];
            if (c.platform === "youtube" && !fs.existsSync(c.credentialsFile)) {
              missing.push(`${c.secretPrefix}_* secrets`);
            }
            if (c.platform === "instagram") {
              if (!process.env.COMPOSIO_API_KEY) missing.push("COMPOSIO_API_KEY");
              if (!process.env.IG_USER_ID) missing.push("IG_USER_ID");
            }
            if (missing.length) {
              console.log(`::warning title=${id} skipped::Missing ${missing.join(", ")}. Nothing rendered, no time wasted.`);
              process.exit(78);
            }
            console.log(`${id} has its credentials. Proceeding.`);
          ' "$CH" || { echo "skip=true" >> $GITHUB_OUTPUT; exit 0; }
        continue-on-error: true

      - name: Generate today's Shorts
        id: generate
        if: steps.gate.outputs.run == 'true' && steps.creds.outputs.skip != 'true'
        run: |
          DATE=$(date -u +%F)
          COUNT="${{ inputs.count || '4' }}"
          NICHE="${{ inputs.niche }}"
          CHANNEL="${{ matrix.channel }}"
          SPECIAL="${{ inputs.special }}"
          # One per channel per run. See the cadence note at the top of this
          # file: the constraint is the inauthentic-content policy, not cost.
          #
          # A run only publishes what it can make well. generate-shorts prefers
          # a verified rich topic and falls back to a padded ThemedShort, so
          # asking for one video a run means the reel path covers it as soon as
          # topics-rich.json has an unused topic for that channel's niches.
          if [ -z "${{ inputs.count }}" ]; then COUNT=1; fi
          # A researched reel or NOTHING — on every trigger, manual included.
          #
          # This used to apply only to the schedule, with manual dispatches
          # keeping the padded ThemedShort fallback "so you can still force a
          # run". On 16 Aug 2026 that path shipped the rejected pastel format
          # to both channels three times in one night: each manual dispatch
          # found its channel's rich topics used up, fell back, and published
          # the exact look the composition fix existed to remove. A forced run
          # of filler is worse than no run. If a dispatch publishes nothing,
          # the answer is to research topics, not to lower the bar.
          ARGS_REELS_ONLY="--reels-only"
          ARGS="--count=$COUNT --date=$DATE"
          [ "$SPECIAL" = "true" ] && ARGS="$ARGS --special"
          [ -n "$NICHE" ]   && ARGS="$ARGS --niche=$NICHE"
          [ -n "$CHANNEL" ] && ARGS="$ARGS --channel=$CHANNEL"
          # Exit 78 means "nothing researched for this channel this week" —
          # a deliberate skip, not a failure. Anything else is a real error.
          set +e
          node scripts/generate-shorts.mjs $ARGS $ARGS_REELS_ONLY
          RC=$?
          set -e
          if [ "$RC" = "78" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing researched for ${{ matrix.channel }}. Skipped."
            exit 0
          fi
          [ "$RC" = "0" ] || exit "$RC"

      - name: Compliance gate
        if: steps.gate.outputs.run == 'true' && steps.creds.outputs.skip != 'true' && steps.generate.outputs.skip != 'true'
        env:
          AI_ENDPOINT: ${{ secrets.AI_ENDPOINT }}
        run: |
          set +e
          DATE=$(date -u +%F)
          node scripts/compliance-gate.mjs --date="$DATE" 2>&1 | tee /tmp/compliance.txt
          GATE_RC=${PIPESTATUS[0]}
          set -e
          echo "### Compliance gate" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/compliance.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "$GATE_RC" = "2" ]; then
            echo "::error title=Compliance gate failed to run::The gate could not evaluate this batch. Nothing will be uploaded."
            exit 1
          fi
          if [ "$GATE_RC" = "1" ]; then
            echo "::warning title=Videos blocked::Some videos were blocked by the compliance gate and will not be uploaded. Cleared videos still publish."
          fi

      # Between compliance and any rendering. Compliance judges the CONTENT;
      # this checks the batch is structurally fit to publish — every field the
      # upload path reads is present, no draft slipped through, audio exists,
      # props and meta agree on the composition.
      #
      # It runs before the render on purpose. Without it, a missing field
      # surfaces at the upload step: minutes of rendering spent, then a failure
      # against a live channel reported as a malformed command rather than a
      # missing field. Seconds here beats that.
      - name: Preflight the batch
        if: steps.gate.outputs.run == 'true' && steps.creds.outputs.skip != 'true' && steps.generate.outputs.skip != 'true'
        run: node scripts/preflight-daily.mjs --date="$(date -u +%F)"

      - name: Host media for Instagram (public URLs)
        if: steps.gate.outputs.run == 'true' && steps.creds.outputs.skip != 'true' && steps.generate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%F)
          node scripts/publish-media.mjs --date="$DATE" || echo "::warning title=Media hosting::No Instagram videos to host, or hosting failed. YouTube uploads are unaffected."

      - name: Render and upload (public)
        if: steps.gate.outputs.run == 'true' && steps.creds.outputs.skip != 'true' && steps.generate.outputs.skip != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_IG_ACCOUNT_ID: ${{ secrets.COMPOSIO_IG_ACCOUNT_ID }}
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.PUBLIC_MEDIA_BASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          DATE=$(date -u +%F)
          node scripts/render-batch.mjs --date="$DATE" --upload 2>&1 | tee /tmp/render-output.txt
          if grep -qi "invalid_grant" /tmp/render-output.txt; then
            echo "::error title=OAuth Expired::YouTube refresh token has expired. Go to GitHub repo Settings, Secrets and variables, Actions, and rotate YT_REFRESH_TOKEN. See AUTOMATION.md for rotation steps."
            exit 1
          fi

      - name: Clean up credentials
        if: always()
        run: |
          rm -f scripts/oauth-client*.json scripts/yt-credentials*.json

      - name: Commit history back
        # MUST include always(). When the upload step exits non-zero this step
        # was skipped, so the record of what DID publish was thrown away.
        # The gate clause keeps it off matrix legs this run did not target.
        # These MUST be one expression: two if keys on one step is a
        # duplicate mapping key, which GitHub rejects as an invalid workflow.
        #
        # No skip guard here on purpose. If the generator skipped, there is
        # nothing new to commit and the script is a no-op; but if an earlier
        # channel in the matrix DID publish, its history must still be written.
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name "bbmw0-bot"
          git config user.email "bot@bbmw0.local"

          # Delegated to a script because the inline rebase-and-retry could
          # never work. Every matrix leg checks out the SAME commit at run
          # start, so leg two commits a published.json built on a base that leg
          # one has already moved. `git pull --rebase` then hits add/add and
          # content conflicts on exactly the files that matter, stops in a
          # detached HEAD, and the remaining attempts die on "unmerged files".
          # On 2026-08-10 that lost the record of four videos that had really
          # been published to @bbm0902.
          #
          # commit-history.mjs commits a DELTA instead of a snapshot: on every
          # attempt it resets to the real origin/main and re-applies just what
          # this leg produced. Verified against a three-way simultaneous race.
          node scripts/commit-history.mjs --date="$(date -u +%F)" --channel="${{ matrix.channel }}"

      - name: Daily content health report
        # Gated: on a skipped matrix leg there is no checkout, so the script is
        # not on disk and the log it writes never exists. `cat` on a missing
        # file exits 1 and would fail the step, marking the whole run red even
        # though nothing was wrong.
        if: always() && steps.gate.outputs.run == 'true' && steps.generate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/daily-report.sh || true
          echo "### BBMW0 Daily Content Report (${{ matrix.channel }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # `cat` a file that may not exist would exit 1 and fail this step.
          cat /tmp/bbmw0-content-report.log 2>/dev/null || echo "(report not produced)"
          cat /tmp/bbmw0-content-report.log >> $GITHUB_STEP_SUMMARY 2>/dev/null \
            || echo "(report not produced)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload artefacts (videos + meta)
        if: always() && steps.gate.outputs.run == 'true' && steps.generate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          # MUST include the channel. upload-artifact@v4 errors on a duplicate
          # artefact name within one run, so with a three-way matrix every leg
          # after the first would fail its upload and turn the run red even
          # when the videos published perfectly.
          name: daily-shorts-${{ matrix.channel }}-${{ github.run_id }}
          path: |
            out/daily-*.mp4
            daily/
          retention-days: 14
          if-no-files-found: ignore
