name: Daily Shorts

on:
  schedule:
    # 09:00 UTC every day. Adjust HH:MM to your preferred publish hour.
    - cron: "0 9 * * *"
  workflow_dispatch:
    # Lets you trigger manually from the Actions tab.
    inputs:
      count:
        description: "Number of Shorts to publish"
        required: false
        default: "5"
      niche:
        description: "Optional niche filter (animals, space, science, etc.)"
        required: false
        default: ""
      research:
        description: "Refresh topics from AI research first?"
        type: boolean
        default: false
      channel:
        description: "Channel id from scripts/data/channels.json (blank = first enabled)"
        required: false
        default: ""

permissions:
  contents: write   # needed to commit history back

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Strip UTF-8 BOMs (OneDrive sync guard)
        run: |
          CLEANED=0
          for f in $(find scripts src .github -type f \( -name "*.json" -o -name "*.mjs" -o -name "*.yml" -o -name "*.ts" -o -name "*.tsx" \) 2>/dev/null); do
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              sed -i '1s/^\xEF\xBB\xBF//' "$f"
              echo "::warning title=BOM stripped::$f had a UTF-8 BOM and was cleaned."
              CLEANED=$((CLEANED+1))
            fi
          done
          echo "BOM guard: $CLEANED file(s) cleaned."
          node -e "const rd=p=>JSON.parse(require('fs').readFileSync(p,'utf8').replace(/^\uFEFF/,'')); rd('./scripts/data/topics.json'); rd('./scripts/data/copy-pools.json'); rd('./scripts/data/published.json'); console.log('All data files parse cleanly.')"

      - name: Install ffmpeg + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install
          npm install googleapis

      - name: Restore YouTube credentials from secrets
        env:
          OAUTH_CLIENT_JSON: ${{ secrets.YT_OAUTH_CLIENT_JSON }}
          REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          if [ -z "$OAUTH_CLIENT_JSON" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "Missing YouTube secrets. Set YT_OAUTH_CLIENT_JSON, YT_REFRESH_TOKEN, YT_CLIENT_ID, YT_CLIENT_SECRET in repo settings." >&2
            exit 1
          fi
          echo "$OAUTH_CLIENT_JSON" > scripts/oauth-client.json
          cat > scripts/yt-credentials.json << JSON
          {
            "client_id": "$CLIENT_ID",
            "client_secret": "$CLIENT_SECRET",
            "refresh_token": "$REFRESH_TOKEN"
          }
          JSON

      - name: (Optional) Refresh topic library via AI research
        if: ${{ inputs.research == true }}
        env:
          AI_ENDPOINT: ${{ secrets.AI_ENDPOINT }}
        run: |
          node scripts/research-trends.mjs --count=10 || echo "research skipped (non-fatal)"

      - name: Auto-refill topics if library is running low
        env:
          AI_ENDPOINT: ${{ secrets.AI_ENDPOINT }}
        run: |
          RD="p=>JSON.parse(require('fs').readFileSync(p,'utf8').replace(/^\uFEFF/,''))"
          TOTAL=$(node -e "const rd=$RD; console.log(rd('./scripts/data/topics.json').topics.length)")
          USED=$(node -e "const rd=$RD; console.log((rd('./scripts/data/published.json').topicsUsed||[]).length)")
          UNUSED=$((TOTAL - USED))
          echo "Topic library: $TOTAL total, $USED used, $UNUSED unused."
          if [ "$UNUSED" -lt 5 ]; then
            echo "::warning title=Low topics::Only $UNUSED topics remaining. Running AI auto-refill."
            if [ -n "$AI_ENDPOINT" ]; then
              node scripts/research-trends.mjs --count=15 || echo "::warning::Auto-refill failed (non-fatal)."
            else
              echo "::warning title=Low topics::AI_ENDPOINT secret not set. Add topics to scripts/data/topics.json manually."
            fi
          fi

      - name: Generate today's Shorts
        run: |
          DATE=$(date -u +%F)
          COUNT="${{ inputs.count || '5' }}"
          NICHE="${{ inputs.niche }}"
          CHANNEL="${{ inputs.channel }}"
          ARGS="--count=$COUNT --date=$DATE"
          [ -n "$NICHE" ]   && ARGS="$ARGS --niche=$NICHE"
          [ -n "$CHANNEL" ] && ARGS="$ARGS --channel=$CHANNEL"
          node scripts/generate-shorts.mjs $ARGS

      - name: Compliance gate
        env:
          AI_ENDPOINT: ${{ secrets.AI_ENDPOINT }}
        run: |
          set +e
          DATE=$(date -u +%F)
          node scripts/compliance-gate.mjs --date="$DATE" 2>&1 | tee /tmp/compliance.txt
          GATE_RC=${PIPESTATUS[0]}
          set -e
          echo "### Compliance gate" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/compliance.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "$GATE_RC" = "2" ]; then
            echo "::error title=Compliance gate failed to run::The gate could not evaluate this batch. Nothing will be uploaded."
            exit 1
          fi
          if [ "$GATE_RC" = "1" ]; then
            echo "::warning title=Videos blocked::Some videos were blocked by the compliance gate and will not be uploaded. Cleared videos still publish."
          fi

      - name: Host media for Instagram (public URLs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%F)
          node scripts/publish-media.mjs --date="$DATE" || echo "::warning title=Media hosting::No Instagram videos to host, or hosting failed. YouTube uploads are unaffected."

      - name: Render and upload (public)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_IG_ACCOUNT_ID: ${{ secrets.COMPOSIO_IG_ACCOUNT_ID }}
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.PUBLIC_MEDIA_BASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          DATE=$(date -u +%F)
          node scripts/render-batch.mjs --date="$DATE" --upload 2>&1 | tee /tmp/render-output.txt
          if grep -qi "invalid_grant" /tmp/render-output.txt; then
            echo "::error title=OAuth Expired::YouTube refresh token has expired. Go to GitHub repo Settings, Secrets and variables, Actions, and rotate YT_REFRESH_TOKEN. See AUTOMATION.md for rotation steps."
            exit 1
          fi

      - name: Clean up credentials
        if: always()
        run: |
          rm -f scripts/oauth-client.json scripts/yt-credentials.json

      - name: Commit history back
        # MUST be always(). When the upload step exits non-zero this step was
        # skipped, so the record of what DID publish was thrown away.
        if: always()
        run: |
          git config user.name "bbmw0-bot"
          git config user.email "bot@bbmw0.local"

          # Add paths ONE AT A TIME. `git add a b c` is all-or-nothing: if any
          # single path does not exist, git stages NOTHING. trend-log.json is
          # only created when AI research runs, so it was usually absent, which
          # silently staged zero files. The `|| true` then hid the error and
          # `git diff --cached --quiet && exit 0` reported success. Result: the
          # publishing history never persisted on any run, topicsUsed stayed
          # frozen, and youtubeId records were lost every time.
          for p in scripts/data/published.json \
                   scripts/data/topics.json \
                   scripts/data/compliance-log.json \
                   scripts/data/audio-licences.json \
                   scripts/data/channels.json \
                   scripts/data/trend-log.json \
                   daily; do
            if [ -e "$p" ]; then
              git add "$p" && echo "  staged: $p"
            else
              echo "  absent (fine): $p"
            fi
          done

          if git diff --cached --quiet; then
            echo "::warning title=Nothing to commit::No history changes were staged. If videos were generated this run, that is a bug."
            exit 0
          fi

          echo "Files to commit:"
          git diff --cached --name-only | sed 's/^/  /'
          git commit -m "Daily Shorts: $(date -u +%F) [skip ci]"

          # A concurrent push (a human committing mid-run) makes a plain push
          # fail non-fast-forward. Rebase and retry rather than losing the run.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, rebasing and retrying ($attempt of 3)..."
            git pull --rebase --autostash origin main || true
            sleep 5
          done

          echo "::error title=History not saved::Could not push the publishing record after 3 attempts. topicsUsed and youtubeId records for this run are LOST, which means topics may be reused."
          exit 1

      - name: Daily content health report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/daily-report.sh || true
          echo "### BBMW0 Daily Content Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/bbmw0-content-report.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload artefacts (videos + meta)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-shorts-${{ github.run_id }}
          path: |
            out/daily-*.mp4
            daily/
          retention-days: 14
